services:
  postgres:
    image: postgres:16
    container_name: project11_postgres
    environment:
      POSTGRES_USER: project11_user
      POSTGRES_PASSWORD: project11_password
      POSTGRES_DB: project11_agent
    ports:
      - "5436:5432"
    volumes:
      - project11_postgres_data:/var/lib/postgresql/data

volumes:
  project11_postgres_data: