services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: project09_postgres

    environment:
      POSTGRES_USER: project09_user
      POSTGRES_PASSWORD: project09_password
      POSTGRES_DB: project09_rag

    ports:
      - "5434:5432"

    volumes:
      - project09_postgres_data:/var/lib/postgresql/data

volumes:
  project09_postgres_data: