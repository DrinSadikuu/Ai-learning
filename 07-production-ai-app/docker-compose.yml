services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_workspace_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_workspace

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: